<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Kidsurukit Online</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101827; color: white; font-family: sans-serif; }
    .game { width: min(92vw, 760px); padding: 24px; border: 4px solid #6cc4ff; background: linear-gradient(#294b4a, #18352c); }
    .hud { display: flex; justify-content: space-between; padding: 12px; background: #07121dcc; border: 2px solid #84cfff; margin-bottom: 20px; }
    .hp-bar { width: 120px; height: 12px; border: 2px solid white; background: #3c1b25; }
    .hp { width: 100%; height: 100%; background: #31d46a; }
    .world { display: flex; justify-content: center; gap: 40px; align-items: center; min-height: 180px; border: 3px dashed #9bcbcf; background: #315b3d; }
    .entity { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 8px; font-weight: bold; }
    button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #e67e22; border: none; color: white; border-radius: 8px; margin-top: 20px; width: 100%; }
  </style>
</head>
<body>
  <main class="game">
    <h1>Kidsurukit Online</h1>
    <section class="hud">
      <div><strong>คิท</strong><div class="hp-bar"><div class="hp"></div></div></div>
      <div><strong>วุ้นเขียว</strong><div class="hp-bar"><div class="hp" id="slime-hp" style="background:#e63946"></div></div></div>
    </section>
    <section class="world">
      <div class="entity" style="border:4px solid #d8f4ff; background:#2589df">คิท</div>
      <div class="entity" style="border:4px solid #a8ffb5; background:#2da143">วุ้น</div>
    </section>
    <button onclick="attack()">ฟันพื้นฐาน</button>
    <script>
      let slimeHp = 100;
      function attack() {
        id="hp-bar"
        if(slimeHp < 0) slimeHp = 0;
        document.getElementById('hp-bar').style.width = slimeHp + '%';
        alert('คิทใช้ ฟันพื้นฐาน! วุ้นได้รับความเสียหาย!');
      }
    </script>
  </main>
</body>
</html>
