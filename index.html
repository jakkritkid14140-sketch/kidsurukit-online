<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kidsurukit Online</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
    }

    .game {
      width: min(92vw, 760px);
      min-height: 500px;
      padding: 24px;
      border: 4px solid #6cc4ff;
      background:
        radial-gradient(circle at 25% 20%, #7380c455, transparent 30%),
        linear-gradient(#294b4a, #18352c);
      box-shadow: 0 0 30px #6cc4ff66;
    }

    h1 {
      margin: 0 0 6px;
      color: #8ddcff;
      text-align: center;
    }

    .place {
      margin: 0 0 24px;
      text-align: center;
      color: #d3e9ff;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      background: #07121dcc;
      border: 2px solid #84cfff;
    }

    .hp-bar {
      width: 180px;
      height: 16px;
      margin-top: 6px;
      overflow: hidden;
      border: 2px solid white;
      background: #3c1b25;
    }

    .hp {
      width: 100%;
      height: 100%;
      background: #31d46a;
    }

    .world {
      display: grid;
      place-items: center;
      min-height: 260px;
      margin: 24px 0;
      border: 3px dashed #9bcbcf;
      background: #315b3d;
    }

    .kit {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      border: 4px solid #d8f4ff;
      border-radius: 8px;
      background: #2589df;
      color: white;
      font-size: 30px;
    }

    .message {
      text-align: center;
      color: #e3f5ff;
    }
  </style>
</head>
<body>
  <main class="game">
    <h1>Kidsurukit Online</h1>
    <p class="place">ป่าหมอกคราม</p>

    <section class="hud">
      <div>
        <strong>คิท นักดาบ</strong>
        <div>เลเวล 1 | EXP 0 / 100</div>
        <div class="hp-bar"><div class="hp"></div></div>
        <small>HP 100 / 100</small>
      </div>
      <div>
        <strong>อาวุธ</strong>
        <div>ดาบไม้</div>
        <div>สกิล: ฟันพื้นฐาน</div>
      </div>
    </section>

    <section class="world">
      <div class="kit">คิท</div>
    </section>

    <p class="message">เดโม 0.1: คิทกำลังออกสำรวจป่าหมอกคราม</p>
  </main>
</body>
</html>
