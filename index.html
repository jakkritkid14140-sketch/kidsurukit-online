<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kidsurukit Online</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101827; color: white; font-family: sans-serif; }
    .game { width: min(92vw, 760px); padding: 24px; border: 4px solid #6cc4ff; background: linear-gradient(#294b4a, #18352c); }
    h1, .place { text-align: center; margin: 0; }
    .hud { display: flex; justify-content: space-between; padding: 12px; background: #07121dcc; border: 2px solid #84cfff; margin-bottom: 20px; }
    .hp-bar { width: 120px; height: 12px; border: 2px solid white; background: #3c1b25; }
    .hp { width: 100%; height: 100%; background: #31d46a; }
    .world { display: flex; justify-content: center; gap: 40px; align-items: center; min-height: 200px; border: 3px dashed #9bcbcf; background: #315b3d; }
    .entity { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 8px; font-size: 24px; font-weight: bold; }
    .kit { border: 4px solid #d8f4ff; background: #2589df; }
    .slime { border: 4px solid #a8ffb5; background: #2da143; }
  </style>
</head>
<body>
  <main class="game">
    <h1>Kidsurukit Online</h1>
    <p class="place">ป่าหมอกคราม</p>
    <section class="hud">
      <div><strong>คิท (นักดาบ)</strong><div class="hp-bar"><div class="hp"></div></div></div>
      <div><strong>วุ้นเขียว (มอนสเตอร์)</strong><div class="hp-bar"><div class="hp" style="background:#e63946"></div></div></div>
    </section>
    <section class="world">
      <div class="entity kit">คิท</div>
      <div class="entity slime">วุ้น</div>
    </section>
    <p style="text-align:center">คิทเผชิญหน้ากับวุ้นเขียวแล้ว! กดรีเฟรชหน้าเว็บเพื่อเริ่มต่อสู้</p>
  </main>
</body>
</html>
