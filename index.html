<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Kidsurukit Online</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101827; color: white; font-family: sans-serif; }
    .game { width: min(92vw, 760px); padding: 24px; border: 4px solid #6cc4ff; background: #18352c; }
    .hud { display: flex; justify-content: space-between; padding: 12px; background: #07121d; border: 2px solid #84cfff; margin-bottom: 20px; }
    .hp-bar { width: 100px; height: 10px; border: 1px solid white; background: #3c1b25; }
    .hp { width: 100%; height: 100%; background: #e63946; transition: 0.3s; }
    button { padding: 15px; width: 100%; background: #e67e22; border: none; color: white; font-size: 18px; cursor: pointer; }
  </style>
</head>
<body>
  <main class="game">
    <h1>Kidsurukit Online</h1>
    <div style="margin-bottom:10px"><strong>คิท</strong> | เลเวล: <span id="lv">1</span> | EXP: <span id="exp">0</span>/100</div>
    <div class="hud">
      <div>วุ้นเขียว<div class="hp-bar"><div id="slime-hp" class="hp" style="background:#31d46a"></div></div></div>
    </div>
    <button onclick="attack()">ฟันพื้นฐาน</button>
    <script>
      let hp = 100, exp = 0, lv = 1;
      function attack() {
        hp -= 34;
        if(hp <= 0) {
          hp = 100;
          exp += 50;
          alert('วุ้นตาย! ได้รับ 50 EXP');
          if(exp >= 100) { lv++; exp = 0; alert('เลเวลอัป! เป็นเลเวล ' + lv); }
        }
        document.getElementById('slime-hp').style.width = hp + '%';
        document.getElementById('exp').innerText = exp;
        document.getElementById('lv').innerText = lv;
      }
    </script>
  </main>
</body>
</html>
